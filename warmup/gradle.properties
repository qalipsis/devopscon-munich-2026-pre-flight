# QALIPSIS release used by the io.qalipsis.bootstrap plugin (same as bootstrap-project).
qalipsis.version=0.18.f

# kapt (QALIPSIS annotation processing) does not support the configuration cache.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kapt.use.k2=true
kotlin.incremental=true
